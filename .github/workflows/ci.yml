name: CI
# Skip paths that cannot change a `check` outcome: tsc covers `src` only, vitest
# includes `src/**` and excludes `**/e2e/**`, and cargo builds `src-tauri/`. So
# docs, the Playwright suites, and the quarantined WDIO tree are all no-ops here.
# (Blocklist, not allowlist: a new/unlisted path defaults to running CI.)
# Filters are safe because `master` is unprotected — no required-check deadlock (#122).
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/**', 'e2e-playwright/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/**', 'e2e-playwright/**']

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      # Cache ~/.cargo + src-tauri/target so cargo test doesn't recompile every
      # crate from scratch each run (the dominant CI cost). Keyed on the Rust
      # toolchain + src-tauri/Cargo.lock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      # vitest unit + component tests (issue #107). `vitest` auto-detects CI
      # (CI=true) and runs once instead of watching.
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features telemetry
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"
