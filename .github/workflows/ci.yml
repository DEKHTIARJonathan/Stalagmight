name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the runner: the self-hosted NUC when it's online AND idle, else fall
  # back to a GitHub-hosted ubuntu-latest. A single ephemeral NUC serializes
  # jobs, so routing every check there would queue them behind each other (and
  # behind the nightly E2E) — the picker spills to hosted whenever the NUC is
  # busy or down. (#134 / #135)
  #
  # The default GITHUB_TOKEN can't read org runner status, so this uses a PAT:
  #   NUC_RUNNER_READ_PAT = fine-grained PAT, org "Self-hosted runners: Read".
  # If that secret is absent/empty (or the API call fails — e.g. a fork PR with
  # no secret access), pick defaults to HOSTED. So this is inert (always-hosted,
  # same as before) until the secret is added, then NUC routing turns on.
  pick:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - name: Choose runner — NUC when online & idle, else hosted
        id: pick
        env:
          GH_TOKEN: ${{ secrets.NUC_RUNNER_READ_PAT }}
        run: |
          # Default to hosted; only route to the NUC if we can POSITIVELY
          # confirm a runner named i5-nuc-runner is online AND idle. Any
          # uncertainty — no token, API error, malformed response, runner
          # missing/busy, or a DUPLICATE stale registration with the same name
          # — sanitizes to 0 and stays on hosted. (Counting matches, not
          # string-comparing one line, keeps a leftover offline dup harmless.)
          runs_on='["ubuntu-latest"]'
          idle=0
          if [ -n "$GH_TOKEN" ]; then
            # On an HTTP error gh writes the error JSON to *stdout* and exits
            # non-zero — so DON'T `|| echo 0` (that appends 0 to the blob).
            # `|| true` shields the assignment from the default bash -e (else
            # pick aborts and check is skipped); then sanitize to a clean int.
            # (Per Daniel's review.)
            idle=$(gh api 'orgs/Stalagmight/actions/runners?per_page=100' \
              --jq '[.runners[] | select(.name=="i5-nuc-runner" and .status=="online" and .busy==false)] | length' \
              2>/dev/null) || true
            [[ "$idle" =~ ^[0-9]+$ ]] || idle=0
            if [ "$idle" -ge 1 ]; then
              runs_on='["self-hosted","ubuntu-latest-local"]'
            fi
          fi
          echo "runs_on=$runs_on" >> "$GITHUB_OUTPUT"
          echo "Routed to $runs_on (idle i5-nuc-runner count: $idle)"

  check:
    needs: pick
    # Default-guard the expression: if pick somehow emits no output, fall back
    # to hosted rather than crash the run with a fromJSON("") error.
    runs-on: ${{ fromJSON(needs.pick.outputs.runs_on || '["ubuntu-latest"]') }}
    # NUC cold ≈ 7m, warm ≈ 4m; hosted ≈ 3m. Generous headroom either way.
    timeout-minutes: 30
    env:
      # Required for sccache to cache on the NUC; harmless on hosted (rust-cache
      # sets it too).
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      # tauri/gtk build deps. Hosted installs them; the NUC image bakes them
      # (see ~/tools/nuc-i5/Dockerfile), so skip the apt-get there.
      - name: Install tauri apt deps (hosted only)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      # Hosted: actions/cache-backed rust-cache restores a prebuilt target/.
      # NUC: that's useless on an ephemeral (--rm) runner — it uses the
      # persistent sccache Docker volume instead (RUSTC_WRAPPER=sccache is set
      # in the container env). 100% warm hit-rate measured in #134.
      - name: Rust cache (hosted only)
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      # vitest unit + component tests (issue #107). `vitest` auto-detects CI
      # (CI=true) and runs once instead of watching.
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features telemetry
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"
