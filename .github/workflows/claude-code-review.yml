name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Don't spend a full LLM review on changes with nothing to review: pure docs
    # and the quarantined WDIO legacy suite. Rust IS reviewed (not ignored).
    # Blocklist style; safe because `master` is unprotected — no required-check deadlock (#122).
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/legacy/**']

# Cancel an in-flight review when a newer push supersedes it, so rapid pushes
# don't each pay for a full review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # SHA-pinned (was @v1, a moving tag) so a retargeted/compromised tag can't
      # silently swap the action that holds our OAuth + app tokens. The SHA is
      # v1.0.152; bump deliberately (ideally via Dependabot).
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # KNOWN GAP: this marketplace is unpinned (tracks HEAD) — and it's the
          # component that actually generates the review, so it's both a drift
          # and a supply-chain risk. Pinning needs an upstream-supported ref
          # syntax; left as a follow-up rather than guess a URL that breaks the
          # run. (#138)
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # LIKELY ROOT-CAUSE FIX (#138): the action buffers inline comments and
          # runs a "real review vs test/probe" classifier before posting. Every
          # run logged "No buffered inline comments" — consistent with the
          # classifier dropping them all. 'false' posts inline comments
          # immediately, skipping that classifier. (use_sticky_comment was the
          # wrong knob: it only consolidates comments into one, it doesn't decide
          # whether anything posts. Unverified until on master — the workflow
          # self-skips on PRs that edit this file.)
          classify_inline_comments: 'false'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

