name: E2E Smoke

# Fast Playwright @smoke subset - the reliable, every-change gate (issue #23).
# Runs against the Vite dev server with mocked Tauri IPC, so it needs only
# Node + Chromium (no Rust/Tauri build). The comprehensive suite runs nightly
# (see nightly-e2e.yml).
# Smoke runs the app with MOCKED Tauri IPC, so a Rust-only (`src-tauri/**`) change
# cannot affect it - skip those here (a real IPC-contract change lands as a `src/**`
# diff via the committed generated types and re-triggers). Also skip docs + the
# separate WDIO legacy suite. Blocklist style; safe because `master` is unprotected (#122).
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/legacy/**', 'e2e/agent/**', 'src-tauri/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/legacy/**', 'e2e/agent/**', 'src-tauri/**']

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Parallel-safety guard (#126): fail before the (slow) browser install if any
      # e2e-playwright spec introduces a pattern that breaks `fullyParallel` - own
      # server/port, fixed-path disk write, foreign host:port, or describe.serial.
      # This is the only CI job that runs the Playwright tier on `e2e-playwright/**`
      # changes (`check` path-ignores them), so the gate lives here. See docs/TESTING.md.
      - name: Check e2e-playwright parallel-safety
        run: pnpm lint:e2e-parallel
      # The timing instrumentation below decides which tests get cut, so its
      # arithmetic is pinned by fixture tests (hook attribution, Worker Cleanup
      # exclusion, failed-run flagging, workflow-command sanitizing). Cheap, and
      # it fails before the slow browser install. TEMPORARY, with the rest of the
      # instrumentation.
      - name: Timing reporter - fixture tests
        run: pnpm lint:pw-timing:test
      # Cache the Chromium browser (~120 MB) so it isn't re-downloaded each run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # TEMPORARY INSTRUMENTATION (remove once the @smoke pare-down lands).
      # CI gives no per-test timing: the `github` reporter prints a line only for
      # tests that failed or flaked, so a green run tells us the suite took ~6.5
      # min but not which tests spent it. A second reporter adds a
      # machine-readable per-test report; per the nightly's note, passing
      # --reporter on the CLI overrides the config reporter WITHOUT touching the
      # shared playwright.config.ts and WITHOUT wrapping the command, so the exit
      # code (the merge gate) is untouched. Costs ~1s.
      # NB: `pnpm exec playwright test`, NOT `pnpm test:ui:smoke -- …` - pnpm
      # forwards the `--` literally and playwright reads it as a positional test
      # filter ("No tests found"). Keep the --grep in sync with test:ui:smoke.
      # NB: the custom reporter, NOT the built-in `json` one - `json` does not emit
      # `steps`, so it cannot separate beforeEach cost from test-body cost. That
      # split is the whole point: measured locally, hooks are ~64% of smoke test
      # time, so the suite is slow because of per-test setup, not slow assertions.
      - name: Run Playwright (@smoke)
        run: pnpm exec playwright test --grep @smoke --reporter=github,./scripts/pw-timing-reporter.mjs
        env:
          # CI=true already gives 2 retries via playwright.config.ts.
          PW_TIMING_OUTPUT: playwright-report/timing.json
      # Ranked cost table on the run summary page. Unlike the nightly (which keeps
      # its report only on failure/flake), timing is wanted on GREEN runs - that
      # is the normal case - so this always runs and writes to the run page,
      # making the data readable with no artifact download. Defensive: always(),
      # cannot fail the job.
      - name: Smoke timing summary (run page)
        if: always()
        run: |
          f="playwright-report/timing.json"
          if [ ! -f "$f" ]; then
            echo "⏱️ **Smoke timing** - results file not found (see job log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/pw-timing-summary.mjs "$f" --top 40 \
            || echo "⏱️ **Smoke timing** - could not parse results (see job log)." >> "$GITHUB_STEP_SUMMARY"
      # Machine-readable backup so the full per-test report can be scraped across
      # several runs (`gh run download <id> -n smoke-timing`). Short retention:
      # this is transient pare-down data, not a durable debugging artifact.
      - name: Upload smoke timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-timing
          path: playwright-report/timing.json
          retention-days: 7
          if-no-files-found: ignore
