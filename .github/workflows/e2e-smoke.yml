name: E2E Smoke

# Fast Playwright @smoke subset — the reliable, every-change gate (issue #23).
# Runs against the Vite dev server with mocked Tauri IPC, so it needs only
# Node + Chromium (no Rust/Tauri build). The comprehensive suite runs nightly
# (see nightly-e2e.yml).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache the Chromium browser (~120 MB) so it isn't re-downloaded each run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:ui:smoke
        env:
          # CI=true already gives 2 retries via playwright.config.ts.
          PW_REPORTER: github
