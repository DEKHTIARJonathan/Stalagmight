name: Nightly E2E Regression

# Comprehensive Playwright suite — the slow regression guard (issue #23).
# Runs on a schedule (and on demand) so timing-sensitive specs don't block the
# fast pre-push / @smoke gate. Like the smoke workflow it runs against the Vite
# dev server with mocked Tauri IPC (Node + Chromium only).
#
# The `full` job runs on the self-hosted NUC (labels: self-hosted,
# ubuntu-latest-local) so the weekly suite costs zero Actions minutes (#130).
#
# NOTE: the heavyweight WebdriverIO suite (e2e/legacy/) drives the real Tauri
# app and is intentionally NOT run here — it stays on-demand. See
# e2e/legacy/README.md.
on:
  schedule:
    # Mondays 07:00 UTC (weekly) — overnight in the Americas, morning in CET.
    # Weekly, not daily, to conserve Actions minutes (#114); run any time on
    # demand via workflow_dispatch.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Don't spend full-suite minutes on a scheduled run when nothing has merged
  # since the last one (we don't work every day). This gate job is ~15s; a
  # manual workflow_dispatch always proceeds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='8 days ago' --pretty=oneline)" ]; then
            echo "commits in the last week — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no commits since the last weekly run — skipping the suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  full:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Self-hosted NUC (i5-7300U, 2C/4T, 8GB) — zero Actions minutes (#130).
    runs-on: [self-hosted, ubuntu-latest-local]
    # Slower box than hosted (~44m at 2 workers); generous headroom over 60.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install the browser fresh each run; no actions/cache step on purpose.
      # This runner is ephemeral (--rm), so ~/.cache/ms-playwright is wiped
      # between jobs and the GitHub cache would just be a network round-trip for
      # the same ~150MB we install anyway (and the shared hosted key was missing
      # chrome-headless-shell). A persistent local volume on the runner is the
      # real fix. (Container runs as root → --with-deps apt works.)
      - name: Install Playwright browser + system deps
        run: pnpm exec playwright install --with-deps chromium
      # --reporter on the CLI (github annotations + a json report file) overrides
      # the config reporter WITHOUT touching the shared playwright.config.ts and
      # WITHOUT wrapping the test command — so the test exit code (the nightly's
      # pass/fail gate) is untouched. The json file feeds the summary step below.
      - name: Run Playwright (full suite)
        run: pnpm test:ui -- --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/pw-results.json
          # NUC is 2C/4T (i5-7300U), 8GB, no GPU → MapLibre specs render via
          # SwiftShader (CPU+RAM heavy). 50% of 4 CPUs = 2 workers (validated
          # sweet spot: 848 passed, 0 flaky, RAM headroom). Percentage, not a
          # bare integer — playwright.config.ts rejects a non-percentage string.
          PW_WORKERS: '50%'
      # Surface results on the run summary page + flag flake/failures as
      # annotations (a 44-min nightly shouldn't need log-spelunking). Defensive:
      # always(), can't fail the job, degrades to a pointer if json/stats absent.
      - name: E2E summary (run page)
        if: always()
        run: |
          f="${{ runner.temp }}/pw-results.json"
          if [ ! -f "$f" ]; then
            echo "🎭 **Nightly E2E** on self-hosted NUC — results file not found (see job log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const s = (require(process.argv[1]).stats) || {};
            const dur = s.duration ? Math.round(s.duration / 1000) + "s" : "?";
            const line = `🎭 **Nightly E2E** on self-hosted NUC — ${s.expected ?? "?"} passed, ${s.flaky ?? 0} flaky, ${s.unexpected ?? 0} failed, ${s.skipped ?? 0} skipped (${dur})`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            if ((s.unexpected ?? 0) > 0) console.log(`::warning title=E2E failures::${s.unexpected} failed test(s) in the nightly suite — see the uploaded report.`);
            else if ((s.flaky ?? 0) > 0) console.log(`::warning title=E2E flake::${s.flaky} flaky test(s) (passed on retry) — watch for instability.`);
          ' "$f" || echo "🎭 **Nightly E2E** on self-hosted NUC — could not parse results (see job log)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
