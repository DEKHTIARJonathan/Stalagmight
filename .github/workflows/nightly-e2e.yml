name: Nightly E2E Regression

# Comprehensive Playwright suite — the slow regression guard (issue #23).
# Runs on a schedule (and on demand) so timing-sensitive specs don't block the
# fast pre-push / @smoke gate. Like the smoke workflow it runs against the Vite
# dev server with mocked Tauri IPC (Node + Chromium only).
#
# The `full` job runs on the self-hosted runner (labels: self-hosted,
# ubuntu-latest-local) so the weekly suite costs zero Actions minutes (#130).
#
# NOTE: the heavyweight WebdriverIO suite (e2e/legacy/) drives the real Tauri
# app and is intentionally NOT run here — it stays on-demand. See
# e2e/legacy/README.md.
on:
  schedule:
    # 07:00 UTC nightly — overnight in the Americas, morning in CET. Runs on the
    # self-hosted runner (zero Actions minutes, #130/#131), so the old weekly cap
    # (to conserve minutes, #114) no longer applies; the gate job still skips a
    # run when nothing has merged since the last one.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip a scheduled run when nothing has merged since the last nightly — the
  # self-hosted run is free, but there's no point re-testing unchanged code (and re-flagging
  # flakes). This gate job is ~15s; a manual workflow_dispatch always proceeds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='2 days ago' --pretty=oneline)" ]; then
            echo "commits since the last nightly — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing merged in the last 2 days — skipping the suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  full:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Optional self-hosted runner — zero Actions minutes (#130).
    runs-on: [self-hosted, ubuntu-latest-local]
    # Slower box than hosted (~44m at 2 workers); generous headroom over 60.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install the browser fresh each run; no actions/cache step on purpose.
      # This runner is ephemeral (--rm), so ~/.cache/ms-playwright is wiped
      # between jobs and the GitHub cache would just be a network round-trip for
      # the same ~150MB we install anyway (and the shared hosted key was missing
      # chrome-headless-shell). A persistent local volume on the runner is the
      # real fix. (Container runs as root → --with-deps apt works.)
      - name: Install Playwright browser + system deps
        run: pnpm exec playwright install --with-deps chromium
      # --reporter on the CLI (github annotations + a json report file) overrides
      # the config reporter WITHOUT touching the shared playwright.config.ts and
      # WITHOUT wrapping the test command — so the test exit code (the nightly's
      # pass/fail gate) is untouched. The json file feeds the summary step below.
      # NB: `pnpm exec playwright test`, NOT `pnpm test:ui -- …` — pnpm forwards
      # the `--` through literally, which playwright reads as a positional test
      # filter ("No tests found"). `pnpm exec` passes the flags straight through.
      - name: Run Playwright (full suite)
        run: pnpm exec playwright test --reporter=github,json
        env:
          # JSON report written into the workspace (not runner.temp) so the
          # upload step can persist it as a durable artifact — the primary
          # consumer is an AI pulling `gh run download` on a failed/flaky nightly
          # to see which specs failed and why. github → annotations; json → the
          # machine-readable per-test report.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          # A small self-hosted runner (no GPU) renders MapLibre specs via
          # SwiftShader (CPU+RAM heavy). A CPU percentage sets the worker count
          # (validated sweet spot: 848 passed, 0 flaky, RAM headroom). Percentage,
          # not a bare integer — playwright.config.ts rejects a non-percentage string.
          PW_WORKERS: '50%'
      # Surface results on the run summary page, flag flake/failures as
      # annotations, and signal the upload step (issues=true) to keep the report.
      # Defensive: always(), can't fail the job, degrades to a pointer if the
      # json is absent. Full per-test detail lives in the results.json artifact.
      - name: E2E summary (run page)
        id: summary
        if: always()
        run: |
          f="playwright-report/results.json"
          if [ ! -f "$f" ]; then
            echo "🎭 **Nightly E2E** on self-hosted runner — results file not found (see job log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const s = (require(process.argv[1]).stats) || {};
            const fs = require("fs");
            const ms = s.duration || 0;
            const dur = !ms ? "?" : ms >= 120000 ? Math.round(ms / 60000) + "m" : Math.round(ms / 1000) + "s";
            const line = `🎭 **Nightly E2E** on self-hosted runner — ${s.expected ?? "?"} passed, ${s.flaky ?? 0} flaky, ${s.unexpected ?? 0} failed, ${s.skipped ?? 0} skipped (${dur})`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            const issues = (s.unexpected ?? 0) > 0 || (s.flaky ?? 0) > 0;
            if (issues && process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, "issues=true\n");
            if ((s.unexpected ?? 0) > 0) console.log(`::warning title=E2E failures::${s.unexpected} failed test(s) — full report in the nightly-e2e-report artifact (gh run download).`);
            else if ((s.flaky ?? 0) > 0) console.log(`::warning title=E2E flake::${s.flaky} flaky test(s) (passed on retry) — trace in the nightly-e2e-report artifact.`);
          ' "$f" || echo "🎭 **Nightly E2E** on self-hosted runner — could not parse results (see job log)." >> "$GITHUB_STEP_SUMMARY"
      # Durable report for post-hoc debugging — primary consumer is an AI pulling
      # `gh run download <run-id> -n nightly-e2e-report` on a failed/flaky nightly.
      # Uploads on any failure OR when the summary flagged failed/flaky specs (a
      # flaky run is green but its retry trace is worth keeping). results.json =
      # machine-readable per-test outcomes + errors; test-results/ = traces,
      # screenshots, videos (trace captured on first retry). 30d so an AI can
      # still pull a few weeks of nightly history; if-no-files-found: ignore so a
      # dev-server-didn't-start failure (no artifacts) doesn't warn.
      - name: Upload E2E report (failures & flakes)
        if: failure() || steps.summary.outputs.issues == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
