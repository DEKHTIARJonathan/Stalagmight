name: Release
on:
  push:
    tags: ['v*']

jobs:
  # Gate the release on the checks the tagged commit should already have passed.
  # Linux-only, which is what this workflow did before it grew a build matrix.
  # Running the suite on macOS and Windows too is tracked separately (#325);
  # note Windows needs STALAGMIGHT_TEST_MANIFEST=1 (see scripts/test.ps1).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch @ 2026-06-30
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features telemetry
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"

  build:
    needs: verify
    strategy:
      # Build every platform even when one fails, so a single broken target
      # reports alongside the others instead of masking them. The release job
      # still needs all three, so nothing half-complete gets published.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            tauri_args: ''
            bundle_dir: src-tauri/target/release/bundle
          # Universal, so one .dmg covers both Apple Silicon and Intel testers.
          # Passing --target moves the bundle output under the triple, which is
          # why this row needs its own bundle_dir.
          - os: macos-latest
            name: macos
            tauri_args: '--target universal-apple-darwin'
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            name: windows
            tauri_args: ''
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch @ 2026-06-30
      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Actions sets CI=true, which is what stops Tauri's DMG bundler from
      # driving Finder over AppleScript and hanging headless (see mac-build.sh).
      # shell: bash so the `--` separating tauri args from cargo args is handled
      # identically everywhere. The Windows default is pwsh, which parses it.
      - name: Build
        shell: bash
        run: pnpm tauri build ${{ matrix.tauri_args }} -- --features telemetry
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
      - name: Collect release artifacts
        shell: bash
        run: |
          BUNDLE_DIR="${{ matrix.bundle_dir }}"
          mkdir -p release-artifacts
          echo "=== All bundle output ==="
          find "$BUNDLE_DIR" -maxdepth 2 -type f || true
          echo "=== Copying artifacts ==="
          # One list for every platform; only the host's own bundles exist.
          for pattern in \
            deb/*.deb \
            rpm/*.rpm \
            appimage/*.AppImage \
            dmg/*.dmg \
            msi/*.msi \
            nsis/*-setup.exe
          do
            cp "$BUNDLE_DIR"/$pattern release-artifacts/ 2>/dev/null || true
          done
          echo "=== Collected ==="
          ls -lh release-artifacts/
          FILE_COUNT=$(find release-artifacts -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No artifacts found in $BUNDLE_DIR"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - run: ls -lh release-artifacts/
      # Extract changelog section for this version
      - name: Extract changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the section between this version header and the next version header.
          # Tolerates both bracketed (## [0.2.0]) and unbracketed (## 0.2.0) headers,
          # with or without a trailing date; terminates on the next "## " heading.
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## +\\[?" ver "\\]?([^0-9.]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          # Fall back if empty
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi
          # Write to file for safe multi-line handling
          echo "$BODY" > /tmp/release-body.md
          # Nothing here is code-signed, so every platform interposes a warning
          # on first launch. Tell recipients how to get past it.
          cat >> /tmp/release-body.md <<'FOOTER'

          ---

          ### Installing

          These builds are not code-signed, so the first launch is blocked on every platform.

          - **macOS**: right-click `Stalagmight.app` and choose **Open**, then confirm. Or clear the quarantine flag: `xattr -dr com.apple.quarantine /Applications/Stalagmight.app`
          - **Windows**: SmartScreen shows "Windows protected your PC". Choose **More info**, then **Run anyway**.
          - **Linux**: install the `.deb` or `.rpm`, or `chmod +x` the `.AppImage` and run it.
          FOOTER
      # Create release and upload assets
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Stalagmight ${TAG}" \
            --notes-file /tmp/release-body.md \
            release-artifacts/*
