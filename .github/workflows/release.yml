name: Release

# Cross-platform release build (#226 P1). Produces installers for macOS
# (Apple Silicon / arm64 .dmg/.app), Windows (.msi/.exe), and Linux
# (.deb/.rpm/.AppImage) from one tag, via tauri-action's matrix. Every job runs
# on a stock GitHub-HOSTED runner — no self-hosted / third-party runner.
#
# Triggers:
#   - push a `v*` tag  → build all platforms, create a DRAFT GitHub Release for
#     review (publish it manually once you've smoke-tested the artifacts). A tag
#     containing `-rc` is marked pre-release.
#   - workflow_dispatch → DRY RUN: build all platforms and upload the bundles as
#     workflow artifacts only (no release created). Use this to validate the
#     matrix without cutting a public release.
#
# Signing: artifacts are currently UNSIGNED (no Apple notarization / Windows
# code-sign) — users bypass Gatekeeper/SmartScreen once on first launch. The
# updater (separate minisign keypair) is wired separately and verifies updates
# regardless of OS signing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # All GitHub-HOSTED runners. macos-latest is Apple Silicon (arm64), so the
        # mac build is native arm64 — no self-hosted runner, no universal/lipo step.
        # ubuntu-22.04 (not -latest/24.04) for broad AppImage glibc compatibility.
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Extract this version's section from CHANGELOG.md for the release body
      # (tag builds only — a dry run has no version). Tolerates bracketed
      # (## [0.2.1]) and unbracketed (## 0.2.1) headers, with/without a date.
      - name: Extract changelog
        id: changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## +\\[?" ver "\\]?([^0-9.]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          [ -z "$BODY" ] && BODY="Release ${GITHUB_REF_NAME}"
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build app + (on a tag) create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
          # Phase 2 (updater) will add:
          # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        with:
          # Empty tagName on a manual dry run → tauri-action just builds, no release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Stalagmight ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true # review + publish manually after smoke-testing
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          tauriScript: pnpm tauri
          args: --features telemetry

      # Dry run only: keep the built bundles as workflow artifacts so the matrix
      # can be validated without creating a release.
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
