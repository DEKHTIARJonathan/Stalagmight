name: Repoint updater manifest

# Rollback/repoint tool for the updater manifests (issues #579, #650). The
# release job publishes manifests automatically on every final (Stable and
# Beta) and rc.N candidate (Beta) tag; this workflow exists for the day that
# automatic publish needs to be undone or redirected by hand - "repoint
# latest-stable.json back at v0.5.0 because v0.5.1 has a bad regression" -
# without cutting a whole new release. Repointing beta rewrites the
# latest-weekly.json mirror with it, as the release job does.
#
# Regenerates one track's manifest from a PAST tag's already-published
# release assets and its own notes, then clobber-uploads it to the rolling
# `updater` release - the same file the automatic publish step would have
# written for that tag. Nothing here builds anything or touches the tagged
# release itself; it only re-derives and re-publishes the manifest.
#
# docs/releasing.md (Updater manifests) has the runbook: repoint first,
# delete the bad release only after, never the other way around.
#
# workflow_dispatch only - this is a deliberate, occasional operator action,
# never something a push or a schedule should trigger.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Which manifest to repoint'
        required: true
        type: choice
        options:
          - stable
          - beta
      tag:
        description: 'Tag to repoint the manifest at (stable: a final such as v0.5.1; beta: a final or a candidate such as v0.5.2-rc.1)'
        required: true
        type: string
      include-darwin:
        # Deliberately required with no default, and not inferred from asset
        # presence: a release can carry an *.app.tar.gz built ad-hoc (see
        # release.yml's Developer-ID-only gate for why that must never enter
        # a manifest), so "the pair exists" is not the same question as "was
        # this actually a Developer ID build" - only the operator checking
        # the original run's log knows the answer.
        description: 'Include the macOS entry? true ONLY for a release built with Developer ID signing - check the original build run''s log first.'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  repoint:
    # Guards a fork running this from its own Actions tab: `updater` and the
    # tags it reads are this repository's releases, not a fork's.
    if: github.repository == 'Stalagmight/Stalagmight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Same fact release.yml's `release` job derives, read the same way: a
      # non-empty plugins.updater.pubkey in the checked-out tauri.conf.json.
      # Repointing a manifest that was never being published makes no sense.
      - name: Determine updater enablement
        id: updater
        shell: bash
        run: |
          PUBKEY=$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)
          if [ -n "$PUBKEY" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate inputs and tag shape
        id: classify
        shell: bash
        env:
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          TRACK: ${{ inputs.track }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$UPDATER_ON" != "true" ]; then
            echo "::error::updater artifacts are disabled (no plugins.updater.pubkey committed) - there is no manifest to repoint."
            exit 1
          fi
          # The same classification release.yml publishes from
          # (scripts/release-channel.sh), checked here in the other
          # direction: the chosen track must be one this tag could have
          # published to, or the repoint would put a manifest on the wrong
          # track entirely. Stable takes finals only; Beta takes finals and
          # rc.N candidates.
          CLASS="$(bash scripts/release-channel.sh classify "$TAG")"
          KIND="$(sed -n 's/^kind=//p' <<<"$CLASS")"
          case "$TRACK" in
            stable)
              if [ "$KIND" != final ]; then
                echo "::error::track is 'stable' but tag '$TAG' is not a bare vX.Y.Z release tag."
                exit 1
              fi
              ;;
            beta)
              if [ "$KIND" != final ] && [ "$KIND" != candidate ]; then
                echo "::error::track is 'beta' but tag '$TAG' is neither a vX.Y.Z-rc.N candidate nor a bare vX.Y.Z release tag."
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown track '$TRACK'."
              exit 1
              ;;
          esac
          printf '%s\n' "$CLASS" >> "$GITHUB_OUTPUT"
      - name: Fetch the target release's assets and notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          INCLUDE_DARWIN: ${{ inputs.include-darwin }}
        run: |
          if ! gh release view "$TAG" --json body > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "::error::release '$TAG' does not exist."
            exit 1
          fi
          jq -r '.body' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/notes.md"
          mkdir -p release-artifacts
          # Only the files the manifest actually reads - not the .deb/.rpm/
          # .msi/.dmg installers, which this workflow has no use for and
          # would otherwise pull down for nothing. Which pair to fetch is the
          # operator's explicit include-darwin input, never inferred from
          # which assets merely exist on the release (an ad-hoc .app.tar.gz
          # can exist there too - see the input's description).
          PATTERNS=(-p '*.AppImage' -p '*.AppImage.sig' -p '*-setup.exe' -p '*-setup.exe.sig')
          if [ "$INCLUDE_DARWIN" = true ]; then
            PATTERNS+=(-p '*.app.tar.gz' -p '*.app.tar.gz.sig')
          fi
          gh release download "$TAG" -D release-artifacts "${PATTERNS[@]}"
          ls -lh release-artifacts/
      - name: Regenerate and upload the manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          INCLUDE_DARWIN: ${{ inputs.include-darwin }}
          MANIFEST_VERSION: ${{ steps.classify.outputs.manifest_version }}
        run: |
          # latest-weekly.json mirrors latest-beta.json byte for byte, as the
          # release job publishes it: 0.5.0/0.5.1 installs set to the retired
          # Weekly track read it.
          case "$TRACK" in
            stable) MANIFESTS=(latest-stable.json) ;;
            beta) MANIFESTS=(latest-beta.json latest-weekly.json) ;;
            *) echo "::error::unknown track '$TRACK'."; exit 1 ;;
          esac
          OUT="release-artifacts/${MANIFESTS[0]}"
          node scripts/gen-updater-manifest.mjs \
            --version "$MANIFEST_VERSION" \
            --tag "$TAG" \
            --dir release-artifacts \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --out "$OUT" \
            --include-darwin "$INCLUDE_DARWIN"
          FILES=("$OUT")
          for name in "${MANIFESTS[@]:1}"; do
            cp "$OUT" "release-artifacts/$name"
            FILES+=("release-artifacts/$name")
          done
          # Same rule as the release job: this workflow only ever uploads to
          # the rolling release, never creates it.
          if ! gh release view updater >/dev/null 2>&1; then
            echo "::error::the rolling 'updater' GitHub release does not exist. See docs/releasing.md (Updater manifests) to create it once, then re-run."
            exit 1
          fi
          gh release upload updater "${FILES[@]}" --clobber
          echo "Repointed ${MANIFESTS[*]} at $TAG, manifest version $MANIFEST_VERSION (include-darwin=$INCLUDE_DARWIN)."
