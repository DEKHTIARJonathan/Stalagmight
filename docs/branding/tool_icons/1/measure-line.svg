<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
  <!-- Measurement line between two endpoints -->
  <line x1="4" y1="12" x2="20" y2="12" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Perpendicular end-ticks -->
  <line x1="4" y1="9" x2="4" y2="15" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="9" x2="20" y2="15" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Station endpoints -->
  <circle cx="4" cy="12" r="2" stroke-width="1.5"/>
  <circle cx="20" cy="12" r="2" stroke-width="1.5"/>
  <!-- Dimension indicator arrows -->
  <path d="M7 6L4 6" stroke-width="1" stroke-linecap="round"/>
  <path d="M17 6L20 6" stroke-width="1" stroke-linecap="round"/>
  <line x1="7" y1="6" x2="17" y2="6" stroke-width="1" stroke-dasharray="1.5 1" stroke-linecap="round"/>
</svg>
