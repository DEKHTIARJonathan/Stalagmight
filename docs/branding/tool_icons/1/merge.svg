<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
  <!-- Two station dots converging -->
  <circle cx="4" cy="8" r="2.5" stroke-width="1.5"/>
  <circle cx="4" cy="8" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="4" cy="16" r="2.5" stroke-width="1.5"/>
  <circle cx="4" cy="16" r="0.8" fill="currentColor" stroke="none"/>
  <!-- Converging arrows -->
  <path d="M7 8L15 12" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M7 16L15 12" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arrowhead at meeting point -->
  <path d="M13 10L16 12L13 14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Result station -->
  <circle cx="19" cy="12" r="2.5" stroke-width="1.5"/>
  <circle cx="19" cy="12" r="0.8" fill="currentColor" stroke="none"/>
</svg>
