<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
  <!-- Survey line between two stations -->
  <line x1="4" y1="18" x2="16" y2="10" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Station dots -->
  <circle cx="4" cy="18" r="2.5" stroke-width="1.5"/>
  <circle cx="4" cy="18" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="16" cy="10" r="2.5" stroke-width="1.5"/>
  <circle cx="16" cy="10" r="0.8" fill="currentColor" stroke="none"/>
  <!-- Red X overlay (top-right) -->
  <line x1="17" y1="2" x2="22" y2="7" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="2" x2="17" y2="7" stroke-width="2" stroke-linecap="round"/>
</svg>
