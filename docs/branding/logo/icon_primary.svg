<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="StalagMight - app icon with headings and depth">
  <title>StalagMight</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#3A251A"/>
      <stop offset="1" stop-color="#1A120B"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E8D8"/>
      <stop offset="1" stop-color="#C1A07A"/>
    </linearGradient>
    <clipPath id="clipOuterCircle">
      <circle cx="512" cy="512" r="310"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#F3E8D8" stroke-width="14" opacity="0.75"/>

  <!-- Scaled mark -->
  <g transform="translate(512 512) scale(1.18) translate(-512 -512)">

    <!-- Prominent stalagmites (clipped) -->
    <g clip-path="url(#clipOuterCircle)" opacity="0.38">
      <!-- dark base -->
      <path d="M180 748
               C250 720 310 742 360 718
               C400 698 420 650 458 640
               C486 632 502 652 512 640
               C534 614 560 610 586 640
               C610 668 642 656 666 676
               C706 710 760 690 844 730
               L844 860 L180 860 Z"
            fill="#0F0906" opacity="0.90"/>

      <!-- three biggest -->
      <path d="M246 860 L282 700 L318 860 Z" fill="#F3E8D8" opacity="0.80"/>
      <path d="M388 860 L426 682 L464 860 Z" fill="#F3E8D8" opacity="0.78"/>
      <path d="M438 860 L470 708 L502 860 Z" fill="#F3E8D8" opacity="0.76"/>

      <!-- other stalagmites -->
      <path d="M342 860 L368 760 L394 860 Z" fill="#C1A07A" opacity="0.72"/>
      <path d="M538 860 L560 772 L582 860 Z" fill="#C1A07A" opacity="0.68"/>

      <!-- moved 5 (between 3 and 4, slightly left, more opaque but same perceived tone) -->
      <path d="M422 860 L450 730 L478 860 Z" fill="#AE8D67" opacity="0.92"/>

      <!-- shadow planes -->
      <path d="M246 860 L282 700 L282 860 Z" fill="#1A120B" opacity="0.22"/>
      <path d="M388 860 L426 682 L426 860 Z" fill="#1A120B" opacity="0.20"/>
      <path d="M438 860 L470 708 L470 860 Z" fill="#1A120B" opacity="0.18"/>
    </g>

    <!-- Double rings -->
    <circle cx="512" cy="512" r="310" fill="none" stroke="#0F0906" stroke-width="22" opacity="0.16"/>
    <circle cx="512" cy="512" r="310" fill="none" stroke="#F3E8D8" stroke-width="14" opacity="0.20"/>

    <circle cx="512" cy="512" r="240" fill="none" stroke="#0F0906" stroke-width="16" opacity="0.14"/>
    <circle cx="512" cy="512" r="240" fill="none" stroke="#F3E8D8" stroke-width="10" opacity="0.12"/>

    <!-- Bearing rays -->
    <g stroke="#C1A07A" stroke-width="10" stroke-linecap="round" opacity="0.32">
      <path d="M512 210V270"/><path d="M512 754V814"/><path d="M210 512H270"/><path d="M754 512H814"/>
      <path d="M708 316l-40 40"/><path d="M316 708l-40 40"/><path d="M316 316l40 40"/><path d="M708 708l40 40"/>
    </g>

    <!-- Survey network -->
    <g fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M320 620 L430 520 L520 600 L640 460 L730 540"/>
      <path d="M430 520 L420 390 L540 360 L640 460"/>
      <path d="M520 600 L520 740"/>
    </g>
<!-- Big outlined cave arrow marker -->
    <g transform="translate(359,585) rotate(137.7) scale(2.70)" opacity="0.95">
      <path d="M0 0 L-22 10 L-22 -10 Z" fill="none" stroke="#0F0906" stroke-width="2.2" stroke-linejoin="round" opacity="0.55"/>
      <path d="M0 0 L-26 14 L-26 -14 Z" fill="#1A120B" opacity="0.28"/>
      <path d="M0 0 L-22 10 L-22 -10 Z" fill="#F3E8D8"/>
    </g>

    <!-- Nodes -->
    <g fill="#F3E8D8" opacity="0.98">
      <circle cx="320" cy="620" r="15"/><circle cx="430" cy="520" r="15"/><circle cx="520" cy="600" r="15"/><circle cx="640" cy="460" r="15"/>
      <circle cx="730" cy="540" r="15"/><circle cx="420" cy="390" r="15"/><circle cx="540" cy="360" r="15"/><circle cx="520" cy="740" r="15"/>
    </g>

  </g>
</svg>
