[package]
name = "cavechef"
version = "1.0.0"
description = "Cave Survey Processing Application"
authors = ["CaveChef Team"]
edition = "2021"

[lib]
name = "cavechef_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
toml = "0.8"
directories = "5"
svg2pdf = "0.12"
usvg = "0.43"
sha2 = "0.10"

[profile.release]
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3.24.0"
