[package]
name = "stalagmight"
version = "0.2.0"
description = "Cave Survey Processing Application"
authors = ["Stalagmight Team"]
edition = "2021"
default-run = "stalagmight"

[features]
e2e = ["tauri-plugin-webdriver-automation"]
telemetry = []
# Dev-only: gates the gen_ipc_types example so it isn't compiled in normal
# builds/tests. Enabled by `pnpm gen:ipc-types`.
ipc-typegen = []

[lib]
name = "stalagmight_lib"
# staticlib dropped — only needed for iOS, which isn't configured (no
# src-tauri/gen/apple). cdylib stays for Android (src-tauri/gen/android).
crate-type = ["lib", "cdylib"]

# Dev-only IPC type generator. Kept as an *example* rather than a `[[bin]]` so
# Tauri's bundler doesn't try to copy it into the .app: the bundler enumerates
# every bin target, and a feature-gated bin still appears in that list but isn't
# built → `tauri build` failed to copy it. `required-features` also keeps it out
# of default `cargo build`/`test`/`--release` — only `pnpm gen:ipc-types` (which
# passes --features ipc-typegen) compiles it.
[[example]]
name = "gen_ipc_types"
path = "examples/gen_ipc_types.rs"
required-features = ["ipc-typegen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "7", features = ["no-serde-warnings"] }
thiserror = "1"
anyhow = "1"
toml = "0.8"
directories = "5"
svg2pdf = "0.12"
usvg = "0.43"
resvg = "0.43"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ureq = "3"
http = "1"
nalgebra = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
# Used both for telemetry's batched event encoding and for the binary
# load_project_full IPC. Always available so we can switch the load path
# off JSON without conditional compilation.
rmp-serde = "1"
serde_bytes = "0.11"
tauri-plugin-webdriver-automation = { git = "https://github.com/FumblingBarbell/tauri-webdriver", branch = "fix/resolve-element-refs-in-execute-sync", optional = true }
compass_data = { path = "vendor/compass_data" }
igrf = "0.2"
proj4rs = "0.1"
time = "0.3"

# `trash` has no Android platform module, and the app ships desktop-only — gate it
# off the Android `cdylib` target so `tauri android build` keeps compiling.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.6"

[profile.dev]
# Backtraces still show file:line; skipping full debug info halves the link step.
debug = "line-tables-only"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pedantic noise — suppressed (too many false positives or impractical to fix)
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
field_reassign_with_default = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
type_complexity = "allow"
unused_self = "allow"
struct_excessive_bools = "allow"
large_enum_variant = "allow"
module_name_repetitions = "allow"
implicit_hasher = "allow"
trivially_copy_pass_by_ref = "allow"

# Panic safety - AI loves .unwrap()
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Cast safety — suppressed (too many false positives across geometry/image code)
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# Prevent AI from silencing lints instead of fixing them
allow_attributes = "deny"

# No debug artifacts or stubs
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Force proper logging
print_stdout = "deny"
print_stderr = "deny"

# Visibility hygiene — AI over-uses pub
wildcard_imports = "deny"

# String nonsense AI generates
inefficient_to_string = "deny"

# Clone-spam — AI appeases the borrow checker with .clone()
cloned_instead_of_copied = "warn"
redundant_clone = "warn"
implicit_clone = "warn"

# Async footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# General AI sloppiness
explicit_into_iter_loop = "deny"
semicolon_if_nothing_returned = "deny"

# ── Extended AI-slop guardrails (2026-06). Rationale + the lints we considered
#    and deliberately DEFERRED (indexing_slicing, get_unwrap, map_err_ignore, …)
#    are recorded in docs/linting.md so they aren't naively re-litigated. ──
# Panic safety, cont.: a Result-returning fn that unwraps internally instead of `?`.
unwrap_in_result = "deny"
# Clone-spam, cont.: force explicit Rc::clone(&x) over x.clone(); no Rc clones in vec![x; n].
clone_on_ref_ptr = "deny"
rc_clone_in_vec_init = "deny"
# String nonsense, cont.: String.to_string() is a pointless re-alloc.
string_to_string = "deny"
# Misc AI footguns: redundant type annotations, mem::forget leaks, lossy float literals.
redundant_type_annotations = "deny"
mem_forget = "deny"
lossy_float_literal = "deny"
# API hygiene: don't request &mut you never use.
needless_pass_by_ref_mut = "deny"
# Dependency hygiene: no `version = "*"` deps.
wildcard_dependencies = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"
unused_qualifications = "deny"
unreachable_pub = "deny"

[dev-dependencies]
tempfile = "3.24.0"
tauri = { version = "2", features = ["test"] }
libc = "0.2"
