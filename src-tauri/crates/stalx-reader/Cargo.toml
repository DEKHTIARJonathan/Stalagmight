[package]
name = "stalx-reader"
version.workspace = true
description = "Read-only reader for Stalagmight .stalx project files"
repository = "https://github.com/Stalagmight/Stalagmight"
readme = false
keywords = ["cave", "survey", "speleology", "sqlite"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
stalagmight-models = { workspace = true }
stalagmight-persistence = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "hooks", "limits"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
